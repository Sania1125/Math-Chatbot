[project]
name = "math-chatbot"
version = "1.0.0"
description = "A small interactive math chatbot that safely evaluates arithmetic expressions, functions, and statistics."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Sania Irshad" }]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
mathbot = "math_chatbot.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# Package discovery (ONE method only; this is enough)
[tool.setuptools.packages.find]
where = ["."]
include = ["math_chatbot*"]
